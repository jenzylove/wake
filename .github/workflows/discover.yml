name: WAKE agent
# Hourly: discover new incidents, then run one agent tick (decide, open, manage on Bitget Demo).
# Exchange keys never reach this runner. Orders go through the deployed executor route, which
# holds the Demo keys server side; this job holds only the scheduler token.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: discovery, cancel-in-progress: false }
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Discover incidents
        run: node scripts/discover-incidents.mjs
      - name: Agent tick
        env:
          WAKE_AGENT_EXECUTOR: https://bitget-lilac.vercel.app/api/agent/execute
          WAKE_SCHEDULER_SECRET: ${{ secrets.WAKE_SCHEDULER_SECRET }}
        run: node scripts/wake-agent.mjs
      - name: Commit log
        run: |
          git config user.name jenzylove
          git config user.email jennifereze12@gmail.com
          git add data/discovered data/wake-paper
          git diff --cached --quiet && exit 0
          git commit -m "WAKE agent tick [skip ci]"
          for i in 1 2 3; do git pull --no-rebase --no-edit && git push && exit 0; sleep 5; done
          exit 1
